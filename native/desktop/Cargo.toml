[package]
name = "voice-studio-native"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
description = "Native Windows voice studio with isolated, resource-limited inference"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader",
  "Win32_System_Threading", "Win32_System_JobObjects", "Win32_System_Memory",
  "Win32_System_ProcessStatus", "Win32_System_SystemInformation",
  "Win32_UI_WindowsAndMessaging", "Win32_UI_Controls", "Win32_UI_Controls_Dialogs",
  "Win32_UI_HiDpi", "Win32_UI_Shell", "Win32_Security", "Win32_Storage_FileSystem",
  "Win32_System_IO", "Win32_System_Pipes", "Win32_Media_Audio",
  "Win32_Networking_WinHttp",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_Security_Cryptography",
] }

[profile.release]
lto = "thin"
strip = true
